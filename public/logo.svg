<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="90" fill="url(#bookGradient)" filter="url(#shadow)"/>
  
  <!-- 书本主体 -->
  <g transform="translate(100, 100)">
    <!-- 书的左侧页面 -->
    <path d="M -35,-25 L -5,-25 L -5,25 L -35,25 Q -40,25 -40,20 L -40,-20 Q -40,-25 -35,-25 Z" 
          fill="url(#pageGradient)" stroke="#E0E0E0" stroke-width="1"/>
    
    <!-- 书的右侧页面 -->
    <path d="M 5,-25 L 35,-25 Q 40,-25 40,-20 L 40,20 Q 40,25 35,25 L 5,25 L 5,-25 Z" 
          fill="url(#pageGradient)" stroke="#E0E0E0" stroke-width="1"/>
    
    <!-- 书脊 -->
    <line x1="-5" y1="-25" x2="-5" y2="25" stroke="#D0D0D0" stroke-width="2"/>
    <line x1="5" y1="-25" x2="5" y2="25" stroke="#D0D0D0" stroke-width="2"/>
    
    <!-- 书页线条（左侧） -->
    <line x1="-30" y1="-15" x2="-10" y2="-15" stroke="#E8E8E8" stroke-width="1"/>
    <line x1="-30" y1="-8" x2="-10" y2="-8" stroke="#E8E8E8" stroke-width="1"/>
    <line x1="-30" y1="-1" x2="-10" y2="-1" stroke="#E8E8E8" stroke-width="1"/>
    <line x1="-30" y1="6" x2="-10" y2="6" stroke="#E8E8E8" stroke-width="1"/>
    <line x1="-30" y1="13" x2="-10" y2="13" stroke="#E8E8E8" stroke-width="1"/>
    
    <!-- 书页线条（右侧） -->
    <line x1="10" y1="-15" x2="30" y2="-15" stroke="#E8E8E8" stroke-width="1"/>
    <line x1="10" y1="-8" x2="30" y2="-8" stroke="#E8E8E8" stroke-width="1"/>
    <line x1="10" y1="-1" x2="30" y2="-1" stroke="#E8E8E8" stroke-width="1"/>
    <line x1="10" y1="6" x2="30" y2="6" stroke="#E8E8E8" stroke-width="1"/>
    <line x1="10" y1="13" x2="30" y2="13" stroke="#E8E8E8" stroke-width="1"/>
    
    <!-- 装饰性元素 - 阅读的眼睛/眼镜 -->
    <circle cx="-18" cy="-35" r="3" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="18" cy="-35" r="3" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
